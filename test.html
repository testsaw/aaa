<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Sign in</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f6f7fb;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 12% 12%, rgba(119, 105, 242, .12), transparent 34%),
        radial-gradient(ellipse at 90% 86%, rgba(43, 182, 166, .10), transparent 32%),
        #f6f7fb;
    }

    .card {
      width: min(100%, 430px);
      padding: 40px;
      border: 1px solid #e8eaf1;
      border-radius: 20px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 24px 70px rgba(31, 41, 69, .10);
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      margin-bottom: 28px;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(140deg, #7668ed, #5142c5);
      font-size: 21px;
      font-weight: 750;
    }

    h1 { margin: 0; font-size: 28px; letter-spacing: -.7px; }
    .intro { margin: 9px 0 28px; color: #6b7280; font-size: 15px; line-height: 1.5; }
    .field { margin-bottom: 19px; }
    label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 650; }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #dfe3ec;
      border-radius: 9px;
      outline: none;
      background: #fff;
      color: #172033;
      font: inherit;
      transition: border-color .15s, box-shadow .15s;
    }

    input::placeholder { color: #a0a6b4; }
    input:focus { border-color: #7668ed; box-shadow: 0 0 0 3px rgba(118, 104, 237, .15); }

    .password-label { display: flex; justify-content: space-between; align-items: center; }
    .password-label label { margin-bottom: 8px; }
    .text-link { color: #6254d4; font-size: 13px; text-decoration: none; }
    .text-link:hover { text-decoration: underline; }

    .submit {
      width: 100%;
      height: 49px;
      margin-top: 5px;
      border: 0;
      border-radius: 9px;
      background: #6254d4;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
      transition: background .15s, transform .15s;
    }

    .submit:hover { background: #5143c3; }
    .submit:active { transform: translateY(1px); }
    .signup { margin: 23px 0 0; color: #6b7280; text-align: center; font-size: 14px; }
    .notice { min-height: 20px; margin: 14px 0 0; color: #5143c3; text-align: center; font-size: 13px; }
    .demo-note { margin: 20px 0 0; color: #8a90a0; text-align: center; font-size: 12px; line-height: 1.5; }

    @media (max-width: 480px) {
      .card { padding: 30px 24px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand-mark" aria-hidden="true">A</div>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to continue to your account.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" required>
      </div>
      <div class="field">
        <div class="password-label">
          <label for="password">Password</label>
          <a class="text-link" href="#forgot-password">Forgot password?</a>
        </div>
        <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
      </div>
      <button class="submit" type="submit">Sign in</button>
      <p class="notice" id="form-notice" role="status" aria-live="polite"></p>
    </form>

    <p class="signup">New here? <a class="text-link" href="#create-account">Create an account</a></p>
    <p class="demo-note">Demo interface only. Sign-in details are not sent or stored.</p>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', (event) => {
      event.preventDefault();
      document.getElementById('form-notice').textContent = 'This demo page is not connected to an authentication service.';
    });
  </script>
</body>
</html>
